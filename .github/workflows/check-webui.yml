name: Check WebUI

# 本 fork 只保留对服务端部署真正有价值的门禁：类型检查与构建。
# 上游原本还有 Lint / Test / Build Electron 三步，但在 fork 中必然失败：
#   - Lint：上游 dashboard 有 32 条存量错误（与上游 main 逐条对比完全一致，非本 fork 引入）
#   - Test：190 条失败，全部是上游「实现改了但测试没跟上」的漂移
#          （如 auth.ts 新增 AbortSignal 参数、ScopedUserSelect 新增 useQuery 却未在测试里包 Provider）
#   - Build Electron：桌面端产物，与服务端部署无关
# 上游的 Test 步骤因 Lint 先失败而长期处于 skipped，这些存量问题因此从未暴露。
on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/check-webui.yml"
  push:
    branches:
      - main
      - dev
      - r-dev
    paths:
      - "dashboard/**"
      - ".github/workflows/check-webui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.1"

      - name: Install dependencies
        working-directory: dashboard
        run: bash ../.github/scripts/install_dashboard_dependencies.sh

      - name: Type check
        working-directory: dashboard
        run: bun run typecheck

      - name: Build
        working-directory: dashboard
        run: bun run build

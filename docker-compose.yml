services:
  core:
    container_name: maim-bot-core
    stop_grace_period: 70s # Runner 最多等待 Worker 60 秒，再保留强制退出时间
    #### prod ####
    # 本地从源码构建：上游 v1.3.19 源码 + ffmpeg（gif-vision 插件转码依赖 ffmpeg/ffprobe）
    build:
      context: .
      dockerfile: Dockerfile
    image: oh-my-maibot:1.3.19
    # image: sengokucola/maibot:latest
    #### dev ####
    # image: sengokucola/maibot:dev
    # image: infinitycat/maibot:dev
    environment:
      - TZ=Asia/Shanghai
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1 # Docker 无法交互确认旧版升级迁移，默认跳过确认提示
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html # 统计数据输出到共享目录，首次运行可自动创建文件
      - HTTP_HOST=0.0.0.0 # Docker 中需要监听全部容器网卡，宿主机才能通过端口映射访问 WebUI
    ports:
      - "127.0.0.1:18001:8001" # webui端口（只绑回环，对外走 OpenResty 反代 https://bot.pyre-z.me）
      - "127.0.0.1:18002:6727" # SnowLuma 反向 WS 适配器监听口
#      - "8000:8000"
    volumes:
      # 监听地址和端口会用于生成或迁移 ./docker-config/mmc/bot_config.toml 的 maim_message 与 webui 配置段
      - ./docker-config/mmc:/MaiMBot/config # 持久化bot配置文件
      - ./data/MaiMBot:/MaiMBot/data # 共享目录
      - ./data/MaiMBot-plugin-data:/MaiMBot/data/plugins # 插件持久数据目录，与插件源码目录隔离
      - ./data/MaiMBot/emoji:/data/emoji # 持久化表情包
      - ./data/MaiMBot/plugins:/MaiMBot/plugins # 插件目录
      # SnowLuma 反向适配器把状态写在自己源码目录的 data/ 下，挂到统一持久目录，插件升级不会丢状态
      - ./data/MaiMBot-plugin-data/pyre-z.snowluma-reverse-adapter:/MaiMBot/plugins/MaiBot-SnowLuma-Reverse-Adapter/data
      - ./data/MaiMBot/logs:/MaiMBot/logs # 日志目录
      - ./depends-data:/MaiMBot/depends-data # 运行时资源文件
      # - site-packages:/usr/local/lib/python3.13/site-packages # 持久化Python包，需要时启用
    restart: always
    networks:
      - maim_bot

  # 启用 HTTPS 时，建议注释掉 core 服务中的 "18001:8001" 端口映射，
  # 然后取消注释此 Caddy 反向代理示例块，并按 dashboard/docs/Caddyfile.docker.example 修改域名。
  # caddy:
  #   image: caddy:2
  #   container_name: maibot-caddy
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./dashboard/docs/Caddyfile.docker.example:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - core
  #   networks:
  #     - maim_bot
  # ── 自带 NapCat 已停用：QQ 侧使用外部主机上的 SnowLuma，
  #    由 MaiBot-SnowLuma-Reverse-Adapter 插件以反向 WS 方式接收（宿主 127.0.0.1:18002）。
  #    需要 NapCat 时把下面 16 行取消注释并 `docker compose up -d napcat`。
  # napcat:
  #   environment:
  #     - NAPCAT_UID=1000
  #     - NAPCAT_GID=1000
  #     - TZ=Asia/Shanghai
  #   ports:
  #     - "127.0.0.1:6099:6099"
  #   volumes:
  #     - ./docker-config/napcat:/app/napcat/config # 持久化napcat配置文件
  #     - ./data/qq:/app/.config/QQ # 持久化QQ本体
  #     - ./data/MaiMBot:/MaiMBot/data # 共享目录
  #   container_name: maim-bot-napcat
  #   restart: always
  #   image: mlikiowa/napcat-docker:latest
  #   networks:
  #     - maim_bot
  sqlite-web:
    # 注意：coleifer/sqlite-web 镜像不支持arm64
    image: coleifer/sqlite-web
    container_name: sqlite-web
    restart: always
    ports:
      - "127.0.0.1:8120:8080" # 只读查看器，只绑回环
    volumes:
      - ./data/MaiMBot:/data/MaiMBot
    environment:
      - SQLITE_DATABASE=MaiMBot/MaiBot.db  # 你的数据库文件
    networks:
      - maim_bot

  # chat2db占用相对较高但是功能强大
  # 内存占用约600m，内存充足推荐选此
  # chat2db:
  #   image: chat2db/chat2db:latest
  #   container_name: maim-bot-chat2db
  #   restart: always
  #   ports:
  #     - "10824:10824"
  #   volumes:
  #     - ./data/MaiMBot:/data/MaiMBot
  #   networks:
  #     - maim_bot
  
# volumes:         #  若需要持久化Python包时启用
#   site-packages:
#   caddy_data:
#   caddy_config:
networks:
  maim_bot:
    driver: bridge
